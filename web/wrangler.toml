# Nostrism Web（LP + /app/ + /api/*）を 1 つの Worker で配信する。設計: #426 7.1 節。
# ルート（nostrism.shino3.net/*）の設定は後続 issue（W-17）で追加する。
name = "nostrism-web"
main = "worker/src/index.ts"
compatibility_date = "2026-09-25"
workers_dev = false            # 本番の workers.dev は閉じる（重複オリジン回避）
preview_urls = true            # PR プレビュー

[assets]
# scripts/assemble-dist.sh が docs/ + app/ + static/ から組み立てる
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

# dev 環境（web-dev ブランチの push でデプロイ: .github/workflows/web-deploy-dev.yml）。
# URL は https://nostrism-web-dev.<account>.workers.dev。routes は持たない。
# main / compatibility_date / [assets] はトップレベルから継承される。
[env.dev]
name = "nostrism-web-dev"
workers_dev = true
preview_urls = false
# トップレベルに本番 routes を足しても dev に継承させない（routes は env に継承される）
routes = []
